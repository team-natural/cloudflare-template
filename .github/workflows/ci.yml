name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs `pnpm install` too — a separate step would install twice.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      # The template ships no migrations, and both `check` and the e2e setup need them.
      - run: pnpm db:generate

      # Deploys apply only committed migrations, so a schema change without one ships code ahead of its DB.
      - name: Migrations match the schema
        run: |
          if [ -n "$(git ls-files packages/schema/migrations)" ] && [ -n "$(git status --porcelain packages/schema/migrations)" ]; then
            git status --porcelain packages/schema/migrations
            echo "::error::packages/schema changed without a committed migration. Run pnpm db:generate and commit the result."
            exit 1
          fi

      - run: pnpm check

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter admin exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - run: pnpm build

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/*/test-results/
          retention-days: 7
