name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Runs `pnpm install` too — a separate step would install twice.
      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          require-lockfile: true

      # migrations/ is generated, not committed, and both `check` and the e2e setup need it.
      - run: pnpm db:generate

      - run: pnpm check

      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm --filter admin exec playwright install --with-deps chromium

      - run: pnpm test:e2e

      - run: pnpm build

      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: apps/*/test-results/
          retention-days: 7
